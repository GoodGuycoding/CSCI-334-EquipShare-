<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Borrower Dashboard - EquipShare</title>
    <link rel="stylesheet" th:href="@{/css/global.css}" />
</head>


<body id="RentalProfileBody">

<div id="RentalProfileD1">
    <img id="RentalProfileD1Logo" src="/images/344logo.png" alt="Logo">

    <div id="RentalProfileD1_1">
        <h1>EQS for borrower</h1>
    </div>

    <div id="RentalProfileD1ProfileImage">
        <img id="RentalProfileD1ProfileImageReal"
             th:src="${user.profilePhotoUrl != null} ? ${user.profilePhotoUrl} : '/images/profileDemo2.png'"
             alt="Profile Image">
    </div>

    <div id="RentalProfileD1_2">
        <h2>Welcome to your profile</h2>
        <h3 th:text="${user.firstName + ' ' + user.lastName}">Nick Rutherford</h3>
    </div>
</div>

<h1>Booking List</h1>

<div id="RentalProfileBookingList" th:if="${bookings != null and !bookings.empty}">
    <div class="RentalProfileBookingList1" th:each="booking : ${bookings}">
        <div>
            <table>
                <tr>
                    <th th:text="${booking.item.title}">Hammer</th>
                </tr>
                <tr>
                    <td>
                        <img class="RentalItemImage1"
                             th:src="${booking.item.itemPhotoUrl != null} ? ${booking.item.itemPhotoUrl} : '/images/profileDemo2.png'"
                             alt="Item Image">
                    </td>
                </tr>
            </table>

            <table class="RentalOwnerDetails">
                <tr>
                    <th>Owner Name:</th>
                    <td th:text="${booking.item.owner.firstName + ' ' + booking.item.owner.lastName}">Tomar khan</td>
                </tr>
                <tr>
                    <th>Booked:</th>
                    <td th:text="${#temporals.format(booking.startDate, 'dd/MM/yyyy')}">12/3/2025</td>
                </tr>
                <tr>
                    <th>Duration:</th>
                    <td th:text="${#temporals.daysBetween(booking.startDate, booking.endDate) + ' days'}">1 Months 12 days</td>
                </tr>
                <tr>
                    <th>Location:</th>
                    <td th:text="${booking.item.location}">14 Thirroul Station St.</td>
                </tr>
                <tr>
                    <th>Status:</th>
                    <td th:text="${booking.status}">APPROVED</td>
                </tr>
            </table>

            <div class="RentedItemPriceAndRating">
                <table>
                    <tr>
                        <th th:text="'Price: $' + ${booking.item.pricePerDay} + ' per day'">Price: $20 per day</th>
                    </tr>
                    <tr th:if="${booking.status == 'COMPLETED'}">
                        <th><img class="RentedItemPriceAndRating1" src="/images/rating.png" alt="Rating"></th>
                    </tr>
                    <tr th:if="${booking.status == 'COMPLETED'}">
                        <td>Rate from 1 to 5 below</td>
                    </tr>
                    <tr th:if="${booking.status == 'COMPLETED'}">
                        <td>
                            <input type="number" class="RentedItemPriceAndRating2" name="rating" min="1" max="5">
                            <button class="RatingSubmitButton" type="button"
                                    th:onclick="'submitRating(\'' + ${booking.id} + '\', this.previousElementSibling.value)'">Submit</button>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="ButtonReturnNotic">
                <table>
                    <tr th:if="${booking.status == 'APPROVED'}">
                        <td>
                            <button class="ButtonReturnNotic1" type="button"
                                    th:text="${'Due in ' + #temporals.daysBetween(#dates.createNow(), booking.endDate) + ' days'}">
                                4 days left to return
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <button class="ButtonReturnNotic2" type="button">
                                <img class="call_Icon" src="/images/phone-icon.png" alt="Call">
                                Contact
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${booking.status == 'APPROVED'}">
                        <td>
                            <button class="ButtonReturnItem" type="button"
                                    th:onclick="'returnItem(\'' + ${booking.id} + '\')'">
                                Mark as Returned
                            </button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:if="${bookings == null or bookings.empty}">
    <p>You have no bookings yet.</p>
</div>

<h1>Personal Detail</h1>
<div id="RentalProfilePersonalDetails">
    <div id="PersonalDetailField">
        <form th:action="@{/borrower/update-profile}" method="post">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" th:value="${user.firstName}">

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" th:value="${user.lastName}"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" th:value="${user.email}" readonly>

            <label for="contact">Contact:</label>
            <input type="text" id="contact" name="contact" th:value="${user.contact}"><br><br>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" th:value="${user.address}">

            <label for="password">New Password (leave blank to keep current):</label>
            <input type="password" id="password" name="password"><br><br>

            <button id="ButtonSaveChangeDetail" type="submit">Save Changes</button>
        </form>
    </div>
</div>

<script>
    function submitRating(bookingId, rating) {
        fetch('/api/bookings/' + bookingId + '/rate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ rating: rating })
        })
            .then(response => response.json())
            .then(data => {
                alert('Rating submitted!');
                location.reload();
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    function returnItem(bookingId) {
        if (confirm('Are you sure you want to mark this item as returned?')) {
            fetch('/api/bookings/' + bookingId + '/return', {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    alert('Item marked as returned!');
                    location.reload();
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
    }
</script>

</body>
</html>
