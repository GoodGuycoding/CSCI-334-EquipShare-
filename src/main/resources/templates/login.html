<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - EquipShare</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>

<!-- Navigation Bar -->
<nav>
    <ul>
        <li class="brand">
            <a th:href="@{/}">
                <img th:src="@{/images/eqs-logo.png}" alt="EQS Logo" class="logo-image"/>
            </a>
        </li>
        <li><a th:href="@{/about}">About Us</a></li>
        <li><a th:href="@{/tools}">Tools</a></li>
        <li><a th:href="@{/contact}">Contact Us</a></li>
        <li><a th:href="@{/profile}">Profile Page</a></li>
        <li class="login-link"><a th:href="@{/login}" class="btn-login">Log In</a></li>
        <li><a th:href="@{/signup}" class="btn-signup">Sign Up</a></li>
    </ul>
</nav>

<!-- Main Content: Login Form -->
<main>
    <div class="card login-card">
        <div class="user-icon-large">👤</div>
        <form th:action="@{/login}" method="post">
            <label for="login-email">Email or Username</label>
            <input type="text" id="login-email" name="email" placeholder="email@eqs.com"/>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="********"/>

            <a th:href="@{/forgot-password}" class="forgot-pw">Forgot Password?</a>

            <button type="submit" name="role" value="borrower" class="btn primary">Borrower</button>
            <button type="submit" name="role" value="renter" class="btn primary">Renter</button>

            <a th:href="@{/signup}" class="btn secondary create-account-btn">Create New Account</a>
        </form>
    </div>
</main>

<!-- Footer -->
<footer>
    <div class="footer-content">
        <div class="brand-info">
            <img th:src="@{/images/eqs-logo.png}" alt="EQS Logo" class="logo-image"/>
        </div>
        <div class="quick-links">
            <h4>Quick Links</h4>
            <ul>
                <li><a th:href="@{/about}">About Us</a></li>
                <li><a th:href="@{/tools}">Tools</a></li>
                <li><a th:href="@{/contact}">Contact Us</a></li>
                <li><a th:href="@{/profile}">Profile Page</a></li>
            </ul>
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2025 EquipShare. All rights reserved.</p>
        <div class="social-icons">
            <a href="#">G</a>
            <a href="#">in</a>
            <a href="#">F</a>
        </div>
    </div>
</footer>

</body>
</html>
