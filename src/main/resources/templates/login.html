<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - EquipShare</title>
    <link rel="stylesheet" th:href="@{/css/global.css}" />
</head>
<body>

<!-- Navigation Bar -->
<nav>
    <ul>
        <li class="brand">
            <a th:href="@{/}">
                <img th:src="@{/images/eqs-logo.png}" alt="EQS Logo" class="logo-image"/>
            </a>
        </li>
        <li><a th:href="@{/about}">About Us</a></li>
        <li><a th:href="@{/tools}">Tools</a></li>
        <li><a th:href="@{/contact}">Contact Us</a></li>
        <li><a th:href="@{/profile}">Profile Page</a></li>
        <li><a th:href="@{/cart}">View Cart</a></li>
        <li class="login-link"><a th:href="@{/login}" class="btn-login">Log In</a></li>
        <li><a th:href="@{/signup}" class="btn-signup">Sign Up</a></li>
    </ul>
</nav>

<!-- Main Content: Login Form -->
<main>
    <div class="card login-card">
        <div class="user-icon-large">👤</div>

        <!-- Success message after signup -->
        <div th:if="${param.signup}" class="alert alert-success">
            Registration successful! Please log in.
        </div>

        <!-- Error message -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/user-login}" method="post">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username"
                       placeholder="email@eqs.com" required
                       th:value="${email != null ? email : ''}"/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="********" required/>
            </div>

            <div class="form-options">
                <a th:href="@{/forgot-password}" class="forgot-pw">Forgot Password?</a>
            </div>

            <!-- Hidden role field that will be set by JavaScript -->
            <input type="hidden" id="selectedRole" name="selectedRole" value="borrower"/>

            <div class="form-group">
                <label>Select Role:</label><br/>
                <input type="radio" id="role-borrower" name="role" value="borrower" checked
                       onclick="document.getElementById('selectedRole').value='borrower'"/>
                <label for="role-borrower">Borrower</label><br/>
                <input type="radio" id="role-owner" name="role" value="owner"
                       onclick="document.getElementById('selectedRole').value='owner'"/>
                <label for="role-owner">Owner</label>
            </div>

            <button type="submit" class="btn primary">Log In</button>

            <div class="signup-link">
                <span>Don't have an account? </span>
                <a th:href="@{/signup}" class="btn secondary">Sign Up</a>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<footer>
    <div class="footer-content">
        <div class="brand-info">
            <img th:src="@{/images/eqs-logo.png}" alt="EQS Logo" class="logo-image"/>
        </div>
        <div class="quick-links">
            <h4>Quick Links</h4>
            <ul>
                <li><a th:href="@{/about}">About Us</a></li>
                <li><a th:href="@{/tools}">Tools</a></li>
                <li><a th:href="@{/contact}">Contact Us</a></li>
                <li><a th:href="@{/profile}">Profile Page</a></li>
            </ul>
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2025 EquipShare. All rights reserved.</p>
        <div class="social-icons">
            <a href="#">G</a>
            <a href="#">in</a>
            <a href="#">F</a>
        </div>
    </div>
</footer>

</body>
</html>

<script>
    // Set the selected role when radio buttons change
    document.querySelectorAll('input[name="role"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.getElementById('selectedRole').value = this.value;
        });
    });
</script>
