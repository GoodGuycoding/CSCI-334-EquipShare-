<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>EquipShare Users</title>
</head>
<body>
<h1>All Registered Users</h1>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Owner?</th>
        <th>Borrower?</th>
        <th>Created At</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">ID</td>
        <td th:text="${user.firstName}">First Name</td>
        <td th:text="${user.lastName}">Last Name</td>
        <td th:text="${user.email}">Email</td>
        <td th:text="${user.isOwner ? 'Yes' : 'No'}">Owner</td>
        <td th:text="${user.isBorrower ? 'Yes' : 'No'}">Borrower</td>
        <td th:text="${user.createdAt}">Created At</td>
    </tr>
    </tbody>
</table>
</body>
</html>
