<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Tools – EquipShare</title>
  <link rel="stylesheet" th:href="@{/css/global.css}" />

</head>
<style>
  .tools-filter-menu {
  margin-bottom: 13px;
  padding: 4px 10px;
  border: none;
  border-radius: 24px;
  font-size: 1rem;
  font-family: "Space Mono", monospace;
  min-width: 250px;
  background: #ffffff;
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.05);
}

.tools-filter-menu:focus {
  outline: none;
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
}
</style>

<body>


<!-- NAVIGATION -->
<nav>
  <ul>
    <li class="brand">
      <a th:href="@{/}">
        <img th:src="@{/images/eqs-logo.png}" alt="EQS Logo" class="logo-image"/>
      </a>
    </li>
    <li><a th:href="@{/about}">About Us</a></li>
    <li><a th:href="@{/tools}">Tools</a></li>
    <li><a th:href="@{/contact}">Contact Us</a></li>
    <li><a th:href="@{/profile}">Profile Page</a></li>
    <li><a th:href="@{/cart}">View Cart</a></li>
    <li class="login-link"><a th:href="@{/login}" class="btn-login">Log In</a></li>
    <li><a th:href="@{/signup}" class="btn-signup">Sign Up</a></li>
  </ul>
</nav>

<!-- Search & Filter -->
<div class="main-content">
  <h1 style="color:white; text-align:center;">Browse Tools</h1>

  <form th:action="@{/tools}" method="get" style="display:flex; justify-content:space-between; align-items:center; margin: 20px 0;">
    <label style="color: white; font-style: bold; margin-bottom: 15px;">Search Items: </label>
    <input type="text" name="keyword" class="tools-search-bar" placeholder="Search tools..." th:value="${param.keyword}" />

    <select name="filter" class="tools-filter-menu">
      <option value="">Filter by...</option>
      <option value="price" th:selected="${param.filter == 'price'}">Price</option>
      <option value="location" th:selected="${param.filter == 'location'}">Location</option>
      <!-- Future -->
      <!-- <option value="rating" th:selected="${param.filter == 'rating'}">Rating</option> -->
    </select>

    <button type="submit" class="btn-next" style="margin-left: 20px; margin-bottom: 12px;">Apply</button>
  </form>
</div>

<div class="tools-grid">
  <div class="tool-card" th:each="tool : ${tools}">
    <a th:href="@{'/tool/' + ${tool.id}}" style="text-decoration:none; color:inherit;">
      <img th:src="${tool.itemPhotoUrl}" alt="Tool image" />
      <p th:text="'Product: ' + ${tool.title}" style="margin-top: 12px;">Tool Title</p>
      <p th:text="'Description: ' + ${tool.description}" style="margin-top: 12px;">Tool Description</p>
      <p th:text="'Price:$ ' + ${tool.pricePerDay} + ' / day'">Price</p>
      <p th:text="'Location: ' + ${tool.location}">Location</p>
      <p th:text="'Owner: ' + ${tool.owner.firstName + ' ' + tool.owner.lastName}">Owner Name</p>
    </a>
  </div>
</div>

<!-- Pagination Controls -->
<div style="text-align:center; margin: 40px 0;">
  <div style="display: inline-flex; gap: 12px; align-items: center;">

    <!-- Previous Button -->
    <a th:if="${currentPage > 0}" th:href="@{/tools(page=${currentPage - 1})}" class="btn-login">Previous</a>

    <!-- Page Numbers -->
    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <a th:href="@{/tools(page=${i})}"
         th:text="${i + 1}"
         th:classappend="${i == currentPage} ? 'btn-signup' : 'btn-login'"
         style="padding: 8px 14px; border-radius: 8px; text-decoration: none;"></a>
    </span>

    <!-- Next Button -->
    <a th:if="${currentPage + 1 < totalPages}" th:href="@{/tools(page=${currentPage + 1})}" class="btn-login">Next</a>

  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-stripe"></div>
  <div class="footer-content">
    <div class="brand-info">
      <img th:src="@{/images/eqs-logo.png}" alt="EQS Logo" class="logo-image" />
    </div>
    <div class="quick-links">
      <h4>Quick Links</h4>
      <ul>
        <li><a th:href="@{/about}">About Us</a></li>
        <li><a th:href="@{/tools}">Tools</a></li>
        <li><a th:href="@{/contact}">Contact Us</a></li>
        <li><a th:href="@{/profile}">Profile Page</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">
    <p>© 2025 EquipShare. All rights reserved.</p>
    <div class="social-icons">
      <a href="#" aria-label="Google">G</a>
      <a href="#" aria-label="LinkedIn">in</a>
      <a href="#" aria-label="Facebook">f</a>
    </div>
  </div>
</footer>

</body>
</html>
